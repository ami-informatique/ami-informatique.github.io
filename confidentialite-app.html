<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="priv.siteTitle">Politique de confidentialité</title>
  <meta name="theme-color" content="#0B3C66">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Cairo:wght@400;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () { try {
      var m = /[?&]lang=(fr|en|ar)\b/.exec(location.search), l = m ? m[1] : localStorage.getItem("ami-lang");
      if (l === "en" || l === "ar") { document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr"; }
    } catch (e) {} })();
  </script>
</head>
<body>
  <!-- Page générique : confidentialite-app.html?app=IDENTIFIANT
       C'est CETTE adresse qu'il faut mettre dans l'application et dans Google Play.
       Le texte se modifie dans l'interface d'administration (Applications → Politique de confidentialité). -->
  <header class="site-header legal-header">
    <div class="container header-inner">
      <a href="index.html" class="brand" data-i18n-attr="aria-label:brand.home">
        <img src="assets/img/favicon.png" alt="" width="36" height="36">
        <span class="brand-text"><span class="brand-ami">AMI</span> Informatique</span>
      </a>
      <div class="header-actions">
        <a href="index.html#applications" class="legal-back legal-back-top" data-i18n="priv.back">← Retour au site</a>
        <div class="lang">
          <button type="button" class="lang-btn" aria-haspopup="true" aria-expanded="false" data-i18n-attr="aria-label:lang.label">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 6h-3a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8ZM12 4a14 14 0 0 1 1.9 4h-3.8A14 14 0 0 1 12 4ZM4.3 14a8 8 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4H4.3Zm.8 2h3a15.7 15.7 0 0 0 1.4 3.6A8 8 0 0 1 5.1 16Zm3-8h-3a8 8 0 0 1 4.4-3.6A15.7 15.7 0 0 0 8.1 8ZM12 20a14 14 0 0 1-1.9-4h3.8A14 14 0 0 1 12 20Zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4Zm.2 5.6a15.7 15.7 0 0 0 1.4-3.6h3a8 8 0 0 1-4.4 3.6Zm1.8-5.6a16.5 16.5 0 0 0 0-4h3.4a8 8 0 0 1 0 4h-3.4Z"/></svg>
            <span data-lang-current>FR</span>
          </button>
          <ul class="lang-menu" hidden>
            <li><button type="button" data-set-lang="fr" lang="fr">Français</button></li>
            <li><button type="button" data-set-lang="en" lang="en">English</button></li>
            <li><button type="button" data-set-lang="ar" lang="ar" dir="rtl">العربية</button></li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <main class="legal">
    <div class="container legal-inner">
      <h1 id="pol-title" data-i18n="priv.siteTitle">Politique de confidentialité</h1>
      <p class="legal-date" id="pol-date"></p>
      <div id="pol-body"></div>
      <p style="margin-top:40px" id="pol-back"></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-brand"><span class="brand-ami">AMI</span> Informatique</p>
      <p class="footer-copy">© <span id="year">2026</span> AMI Informatique · <span data-i18n="footer.city">Maradi, Niger</span></p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/apps-data.js"></script>
  <script>
  (function () {
    var A = AMI_APPS, esc = A.esc, t = A.t, app = null, id = A.param("app");
    var y = document.getElementById("year"); if (y) y.textContent = new Date().getFullYear();
    function rendre() {
      var titre = document.getElementById("pol-title"), date = document.getElementById("pol-date"),
          corps = document.getElementById("pol-body"), retour = document.getElementById("pol-back");
      if (!app) return;
      titre.removeAttribute("data-i18n");
      titre.textContent = t("app.policyOf") + app.nom;
      document.title = titre.textContent;
      date.textContent = app.politiqueDate ? t("priv.updatedPrefix") + A.dateLisible(app.politiqueDate) : "";
      var html = A.texteRiche(A.tr(app.politique));
      corps.innerHTML = html || "<p>" + esc(t("app.noPolicy")) + "</p>";
      retour.innerHTML = '<a class="btn btn-ghost" href="application.html?app=' + encodeURIComponent(app.id) + '">' + esc(t("app.back").replace(/^[←→]\s*/, "")) + " — " + esc(app.nom) + "</a>";
    }
    A.charger().then(function (liste) {
      app = liste.filter(function (a) { return a.id === id; })[0] || null;
      if (!app) document.getElementById("pol-body").innerHTML = "<p>" + esc(t("app.notFound")) + "</p>";
      else rendre();
    }).catch(function () {
      document.getElementById("pol-body").innerHTML = "<p>" + esc(A.messageHorsLigne()) + "</p>";
    });
    document.addEventListener("langchange", rendre);
  })();
  </script>
</body>
</html>
